name: release

# Push a vX.Y.Z tag to publish. The tag must match the version in Cargo.toml
# and release-notes/vX.Y.Z.md must exist. The publish job signs every asset
# with MINISIGN_SECRET_KEY; the app checks those signatures before it updates.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Tag, version, and notes agree
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "${GITHUB_REF_NAME#v}" = "$version" \
            || { echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1; }
          test -f "release-notes/$GITHUB_REF_NAME.md" \
            || { echo "::error::write release-notes/$GITHUB_REF_NAME.md before tagging"; exit 1; }

  macos:
    needs: check
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build
        run: UNIVERSAL=1 scripts/bundle-macos.sh
      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: |
            dist/Brook.zip
            dist/Brook-macos.app.tar.gz

  linux:
    needs: check
    strategy:
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux libraries
        run: scripts/linux-deps.sh
      - name: Build
        run: scripts/bundle-linux.sh
      - uses: actions/upload-artifact@v5
        with:
          name: linux-${{ matrix.runner }}
          path: dist/Brook-linux-*.tar.gz

  # Signing happens in one place, on macOS, where Homebrew has minisign.
  publish:
    needs: [macos, linux]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Sign for the updater
        env:
          KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          brew install minisign
          printf '%s\n' "$KEY" > key
          for path in dist/*; do
            f=$(basename "$path")
            minisign -S -s key -m "$path" -t "Brook $GITHUB_REF_NAME $f" < /dev/null
          done
          rm key
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Brook ${GITHUB_REF_NAME#v}" \
            --notes-file "release-notes/$GITHUB_REF_NAME.md" dist/*

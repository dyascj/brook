[package]
name = "brook"
description = "A calm, local RSS reader."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
brook-core.workspace = true
chrono.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui-component = "0.8"
gpui-kit-assets = "0.8"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "runtime_shaders", "x11", "wayland"] }
env_logger.workspace = true
futures.workspace = true
log.workspace = true
url.workspace = true

[features]
# Renders the app off-screen for README screenshots (macOS only).
screenshots = ["gpui/test-support", "gpui_platform/test-support"]

[[example]]
name = "screenshots"
required-features = ["screenshots"]

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
